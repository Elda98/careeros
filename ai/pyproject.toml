[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros-ai"
version = "0.1.0"
description = "CareerOS Intelligence Layer — agent orchestration (LangGraph/LangChain), capabilities, and Knowledge Layer contracts. See SAS Part I §4 and Part II §11."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["careeros_ai*"]
